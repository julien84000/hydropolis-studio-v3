name: run-restore-export-v1157

on:
  push:
    branches:
      - "fix/v11.57-sira-pdf-audit"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v11.57-sira-pdf-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python .github/restore-export-v1157.py
      - run: npm ci
      - run: npm run build
      - name: Commit validated export restoration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js tests/v11.57-regression.test.js
          git rm .github/restore-export-v1157.py .github/workflows/run-restore-export-v1157.yml
          git commit -m "fix: restore Excel export after V11.57 refactor"
          git push origin HEAD:fix/v11.57-sira-pdf-audit
