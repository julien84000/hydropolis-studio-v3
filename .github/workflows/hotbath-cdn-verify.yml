name: Hotbath CDN image verification

on:
  push:
    branches:
      - feat/v11.63.2-hotbath-official-gallery
    paths:
      - scripts/verify-hotbath-cdn.py
      - .github/workflows/hotbath-cdn-verify.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotbath-cdn-verify
  cancel-in-progress: false

jobs:
  verify-images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP and image validators
        run: python -m pip install requests==2.32.3 Pillow==11.3.0
      - name: Verify and rewrite dead archive URLs only after an HTTP and raster check
        run: python scripts/verify-hotbath-cdn.py --workers 16
      - name: Commit audited CDN links and missing-image report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand-guide-hotbath-media.json docs/HOTBATH_CDN_AUDIT.json
          if git diff --cached --quiet; then
            echo "No verified image changes"
          else
            git commit -m "Hotbath: remplacer les archives 404 par les seules images CDN réellement vérifiées"
            for i in 1 2 3 4 5; do
              git fetch origin refs/heads/feat/v11.63.2-hotbath-official-gallery
              git rebase FETCH_HEAD
              if git push origin HEAD:refs/heads/feat/v11.63.2-hotbath-official-gallery; then
                echo "Audited CDN links committed without overwriting remote changes"
                exit 0
              fi
              echo "Concurrent commit; retrying rebase + push $i/5"
              sleep 3
            done
            echo "Unable to publish audited CDN links after 5 safe retries" >&2
            exit 1
          fi
