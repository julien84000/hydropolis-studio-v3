name: V11.57 source corrections

on:
  push:
    branches:
      - "fix/v11.57-sira-pdf-audit"
    paths:
      - ".github/workflows/source-edit-v1157.yml"

permissions:
  contents: write

jobs:
  edit-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v11.57-sira-pdf-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply source-level fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def section(text, start, end, replacement):
              i=text.find(start)
              if i<0: raise SystemExit(f"start token not found: {start}")
              j=text.find(end,i)
              if j<0: raise SystemExit(f"end token not found: {end}")
              return text[:i]+replacement+text[j:]

          # HOTBATH — keep the exact path emitted by the official site.
          server_path=Path('server.js')
          server=server_path.read_text()
          old='''function normalizeHotbathAssetUrl(raw,baseUrl){\n  const href=absoluteUrl(baseUrl,raw);\n  if(!href)return null;\n  try{\n    const u=new URL(href);\n    u.pathname=u.pathname.replace(/\\/{2,}/g,"/");\n    return u.href;\n  }catch{return href}\n}'''
          new='''function normalizeHotbathAssetUrl(raw,baseUrl){\n  const href=absoluteUrl(baseUrl,raw);\n  if(!href)return null;\n  try{\n    const u=new URL(href);\n    // Hotbath currently publishes some valid assets with a deliberate double slash\n    // in /documents//ProdCateg/. Do not rewrite the manufacturer path: collapsing\n    // it to /documents/ProdCateg/ can turn a valid official asset into a 404.\n    return u.href;\n  }catch{return href}\n}'''
          if old not in server:
              raise SystemExit('Hotbath normalizer source did not match expected V11.56.1 code')
          server=server.replace(old,new,1)
          server_path.write_text(server)

          # QUOTE — structure rows by room, then functional bathroom space.
          app_path=Path('public/app.js')
          app=app_path.read_text()

          quote_editor_rows='''const QUOTE_SPACE_ORDER={LAVABO:0,DOUCHE:1,BAIN:2,WC:3,AUTRES:4};
function quoteSpaceForProduct(p){
  if(!p)return "AUTRES";
  if(p.requiredRoughIn){
    const parent=(state.selected||[]).find(x=>
      x && x.id!==p.id && (
        x.id===p.parentId || x.id===p.parentProductId || x.id===p.accessoryFor ||
        x.roughInChildId===p.id || x.requiredRoughInId===p.id
      )
    );
    if(parent)return presentationSpace(parent);
  }
  return presentationSpace(p);
}
function quoteSpaceLabel(space){return presentationSpaceLabel(space)||"Autres éléments";}
function quoteEditorRows(){
  const rows=[];
  for(const room of state.rooms||[]){
    const roomRows=[];
    (state.selected||[]).forEach((p,sourceIndex)=>{
      if(p.roomId!==room.id || !isRealSelectedProduct(p))return;
      const space=quoteSpaceForProduct(p);
      roomRows.push({
        kind:"product",sourceIndex,sourceOrder:sourceIndex,roomId:room.id,room:room.title,space,spaceLabel:quoteSpaceLabel(space),
        manufacturer:p.manufacturer||"",finish:p.finish||"",
        reference:quoteLineReference(p),designation:quoteLineDesignation(p),
        leadTime:quoteLineLeadTime(p),qty:itemQuantity(p),
        unit:quoteLineUnit(p),discount:quoteLineDiscount(p),
        total:quoteLineNetUnit(p)*itemQuantity(p)
      });
    });
    validManualItemsForRoom(room).forEach((m,manualIndex)=>{
      const space="AUTRES";
      roomRows.push({
        kind:"manual",manualIndex,sourceOrder:100000+manualIndex,roomId:room.id,room:room.title,space,spaceLabel:quoteSpaceLabel(space),
        manufacturer:"Élément libre",finish:"",
        reference:manualQuoteReference(m),designation:manualQuoteDesignation(m),
        leadTime:manualQuoteLeadTime(m),qty:manualItemQuantity(m),
        unit:manualQuoteUnit(m),discount:manualQuoteDiscount(m),
        total:manualQuoteNetUnit(m)*manualItemQuantity(m)
      });
    });
    roomRows.sort((a,b)=>(QUOTE_SPACE_ORDER[a.space]??99)-(QUOTE_SPACE_ORDER[b.space]??99)||a.sourceOrder-b.sourceOrder);
    rows.push(...roomRows);
  }
  return rows;
}
'''
          app=section(app,'function quoteEditorRows(){','function quoteEditorTarget',quote_editor_rows)

          render_editor='''function renderQuoteEditor(){
  const host=$("#quoteEditor");if(!host)return;
  const rows=quoteEditorRows();

  if(!rows.length){
    host.innerHTML='<div class="margin-empty">Ajoutez des articles au projet pour construire le devis.</div>';
  }else{
    const bodyRows=[];
    let lastRoom="",lastSpace="";
    for(const row of rows){
      if(row.room!==lastRoom){
        bodyRows.push('<tr class="qe-room-group"><td colspan="8">'+esc(row.room)+'</td></tr>');
        lastRoom=row.room;lastSpace="";
      }
      if(row.space!==lastSpace){
        bodyRows.push('<tr class="qe-space-group"><td colspan="8">'+esc(row.spaceLabel)+'</td></tr>');
        lastSpace=row.space;
      }
      const attrs=quoteEditorAttributes(row);
      bodyRows.push('<tr class="qe-product-row">'+
        '<td><input class="qe-input qe-ref" '+attrs+' value="'+esc(row.reference)+'"></td>'+
        '<td><input class="qe-input qe-designation" '+attrs+' value="'+esc(row.designation)+'"><small class="qe-product-meta">'+esc(row.manufacturer)+(row.finish?' · '+esc(row.finish):'')+'</small></td>'+
        '<td><input class="qe-input qe-lead" '+attrs+' value="'+esc(row.leadTime)+'" placeholder="Délai"></td>'+
        '<td><input class="qe-input qe-qty" '+attrs+' type="number" min="1" max="999" step="1" value="'+row.qty+'"></td>'+
        '<td><input class="qe-input qe-unit" '+attrs+' type="number" min="0" step="0.01" value="'+Number(row.unit||0).toFixed(2)+'"></td>'+
        '<td><div class="qe-percent"><input class="qe-input qe-discount" '+attrs+' type="number" min="0" max="100" step="0.1" value="'+Number(row.discount||0).toFixed(1)+'"><span>%</span></div></td>'+
        '<td class="qe-total">'+euro(row.total)+'</td>'+
        '<td><button type="button" class="tiny qe-reset" '+attrs+' title="Réinitialiser cette ligne">↺</button></td>'+
      '</tr>');
    }
    host.innerHTML='<div class="quote-editor-wrap"><table class="quote-editor-table">'+
      '<thead><tr><th>Référence</th><th>Désignation</th><th>Délai</th><th>Qté</th><th>PU HT</th><th>Remise</th><th>Total HT</th><th></th></tr></thead>'+
      '<tbody>'+bodyRows.join('')+'</tbody></table></div>';
  }

  const commit=(el,key,mode="text")=>{
    const target=quoteEditorTarget(el);if(!target)return;
    if(mode==="qty"){
      if(el.dataset.kind==="product")setProductQuantity(target.id,el.value);
      else target.quantity=normalizedQuantity(el.value);
    }else if(mode==="money"){
      target[key]=Math.max(0,Number(el.value)||0);
    }else if(mode==="percent"){
      target[key]=clampPercent(el.value);
    }else{
      target[key]=String(el.value||"");
    }
    saveState();renderMarginDashboard();
  };

  $$(".qe-ref",host).forEach(el=>el.onchange=()=>commit(el,"quoteReferenceOverride"));
  $$(".qe-designation",host).forEach(el=>el.onchange=()=>commit(el,"quoteDesignationOverride"));
  $$(".qe-lead",host).forEach(el=>el.onchange=()=>commit(el,"quoteLeadTimeOverride"));
  $$(".qe-qty",host).forEach(el=>el.onchange=()=>commit(el,"quantity","qty"));
  $$(".qe-unit",host).forEach(el=>el.onchange=()=>commit(el,"quoteUnitOverride","money"));
  $$(".qe-discount",host).forEach(el=>el.onchange=()=>commit(el,"quoteDiscountOverride","percent"));

  $$(".qe-reset",host).forEach(btn=>btn.onclick=()=>{
    const target=quoteEditorTarget(btn);if(!target)return;
    clearQuoteLineOverrides(target);saveState();renderMarginDashboard();
  });

  const reset=$("#resetQuoteEditorBtn");
  if(reset)reset.onclick=()=>{
    if(!confirm("Réinitialiser les modifications du devis ? Les quantités du projet seront conservées."))return;
    (state.selected||[]).forEach(clearQuoteLineOverrides);
    (state.rooms||[]).forEach(r=>validManualItemsForRoom(r).forEach(clearQuoteLineOverrides));
    saveState();renderMarginDashboard();
  };
}
'''
          app=section(app,'function renderQuoteEditor(){','function renderMarginDashboard(){',render_editor)

          quote_block='''function quoteRows(){
  const rows=[];
  for(const room of state.rooms||[]){
    const roomRows=[];
    (state.selected||[]).forEach((p,sourceIndex)=>{
      if(p.roomId!==room.id || !isRealSelectedProduct(p))return;
      const qty=itemQuantity(p);
      const unit=quoteLineUnit(p);
      const discount=quoteLineDiscount(p);
      const space=quoteSpaceForProduct(p);
      roomRows.push({
        room:room.title,roomId:room.id,space,spaceLabel:quoteSpaceLabel(space),sourceOrder:sourceIndex,
        reference:quoteLineReference(p),designation:quoteLineDesignation(p),finish:p.finish||"",
        manufacturer:p.manufacturer||"",qty,unit,netUnit:unit*(1-discount/100),
        freight:0,leadTime:quoteLineLeadTime(p),manual:false,discount,sourceIndex,sourceId:p.id||""
      });
    });
    validManualItemsForRoom(room).forEach((m,manualIndex)=>{
      const qty=manualItemQuantity(m);
      const unit=manualQuoteUnit(m);
      const discount=manualQuoteDiscount(m);
      const space="AUTRES";
      roomRows.push({
        room:room.title,roomId:room.id,space,spaceLabel:quoteSpaceLabel(space),sourceOrder:100000+manualIndex,
        reference:manualQuoteReference(m),designation:manualQuoteDesignation(m),finish:"",
        manufacturer:"Élément libre",qty,unit,netUnit:unit*(1-discount/100),
        freight:0,leadTime:manualQuoteLeadTime(m),manual:true,discount,manualIndex
      });
    });
    roomRows.sort((a,b)=>(QUOTE_SPACE_ORDER[a.space]??99)-(QUOTE_SPACE_ORDER[b.space]??99)||a.sourceOrder-b.sourceOrder);
    rows.push(...roomRows);
  }
  return rows;
}
function quotePages(startNo){
  const rows=quoteRows();
  const f=projectFinancials();
  const showDiscountColumn=rows.some(row=>Number(row.discount)>0.0001);

  // Eight article rows leave enough vertical room for the room and space headings.
  // Headings are repeated automatically when a page starts in the middle of a group.
  const perPage=8;
  const pages=Math.max(1,Math.ceil(rows.length/perPage));
  let html="", no=startNo;
  const columnCount=(state.showSupplierReferences!==false?1:0)+5+(showDiscountColumn?1:0);

  for(let pg=0;pg<pages;pg++){
    const chunk=rows.slice(pg*perPage,(pg+1)*perPage);
    const last=pg===pages-1;
    let previousRoom="",previousSpace="";
    const quoteBody=chunk.map(row=>{
      let prefix="";
      if(row.room!==previousRoom){
        prefix+=`<tr class="quote-room-row"><td colspan="${columnCount}">${esc(row.room)}</td></tr>`;
        previousRoom=row.room;
        previousSpace="";
      }
      if(row.space!==previousSpace){
        prefix+=`<tr class="quote-space-row"><td colspan="${columnCount}">${esc(row.spaceLabel)}</td></tr>`;
        previousSpace=row.space;
      }
      return prefix+`<tr class="quote-product-row">
        ${state.showSupplierReferences!==false?`<td>${esc(row.reference||"—")}</td>`:""}
        <td><b>${esc(row.designation)}</b><small>${esc(row.manufacturer)}${row.finish?` · ${esc(row.finish)}`:""}</small></td>
        <td>${esc(row.leadTime||"—")}</td>
        <td>${row.qty}</td>
        <td>${euro(row.unit)}</td>
        ${showDiscountColumn?`<td>${row.discount?`${row.discount.toLocaleString("fr-FR",{maximumFractionDigits:1})}%`:"—"}</td>`:""}
        <td>${euro(row.netUnit*row.qty)}</td>
      </tr>`;
    }).join("") || `<tr><td colspan="${columnCount}">Aucun produit sélectionné.</td></tr>`;

    html+=`<section class="page quote-page ${showDiscountColumn?"quote-with-discount":"quote-without-discount"}">
      <div class="quote-topline"></div>
      <div class="quote-head">
        <div><div class="section-kicker">DEVIS · ${esc(state.project.name||"PROJET CLIENT")}</div><h2>Récapitulatif de la sélection${pages>1?` · ${pg+1}/${pages}`:""}</h2><p>${esc(state.project.client||"")}${state.project.location?` · ${esc(state.project.location)}`:""}</p></div>
        <div class="quote-brand">Hydropolis${salespersonContactLine()?`<small>${salespersonProfile()?[salespersonProfile().name,salespersonProfile().title,salespersonProfile().phone,salespersonProfile().email].filter(Boolean).map(esc).join("<br>"):""}</small>`:""}</div>
      </div>

      <table class="quote-table">
        <thead><tr>
          ${state.showSupplierReferences!==false?`<th>Référence</th>`:""}
          <th>Désignation</th><th>Délai</th><th>Qté</th><th>PU HT</th>
          ${showDiscountColumn?`<th>Remise</th>`:""}<th>Total HT</th>
        </tr></thead>
        <tbody>${quoteBody}</tbody>
      </table>

      ${last?`<div class="quote-totals">
        <div><span>Sous-total tarif HT</span><b>${euro(f.list)}</b></div>
        ${f.discountAmount>0.005?`<div class="quote-discount"><span>Total remises commerciales</span><b>− ${euro(f.discountAmount)}</b></div>`:""}
        ${f.shipping>0?`<div><span>Frais de port HT</span><b>${euro(f.shipping)}</b></div>`:""}
        ${f.supplierShipping>0?`<div><span>Port fournisseur HT</span><b>${euro(f.supplierShipping)}</b></div>`:""}
        <div class="quote-total-ht"><span>Total HT</span><b>${euro(f.net)}</b></div>
        <div><span>TVA ${f.vatRate.toLocaleString("fr-FR",{maximumFractionDigits:1})}%</span><b>${euro(f.vat)}</b></div>
        <div class="quote-grand-total"><span>GRAND TOTAL TTC</span><b>${euro(f.ttc)}</b></div>
      </div>`:""}

      <div class="quote-bottom"><span>${salespersonContactLine()?`Maison Hydropolis · ${salespersonContactLine(" · ")}`:"Maison Hydropolis"}</span><span>Prix exprimés en euros · devis récapitulatif</span></div>
      <div class="page-no">${no++}</div>
    </section>`;
  }
  return {html,nextNo:no};
}
'''
          app=section(app,'function quoteRows(){','function renderSelection(){',quote_block)
          app_path.write_text(app)

          css_path=Path('public/styles.css')
          css=css_path.read_text()
          marker='/* V11.57_QUOTE_STRUCTURE */'
          if marker not in css:
              css+='''\n\n/* V11.57_QUOTE_STRUCTURE */
.quote-table .quote-room-row td{font-weight:800;font-size:9pt;letter-spacing:.04em;text-transform:uppercase;padding:7px 8px;border-top:1.5px solid #222;border-bottom:1px solid #222;background:#222;color:#fff}
.quote-table .quote-space-row td{font-weight:750;font-size:7.5pt;letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;background:#f3eadf;color:#8a5b24;border-bottom:1px solid #d9c7af}
.quote-table .quote-product-row td{vertical-align:top}
.quote-editor-table .qe-room-group td{padding:10px 12px 7px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:#222;color:#fff;border-top:8px solid #fff}
.quote-editor-table .qe-space-group td{padding:7px 12px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;background:#f3eadf;color:#8a5b24}
.quote-editor-table .qe-product-row td{vertical-align:top}
.qe-product-meta{display:block;margin-top:4px;font-size:10px;line-height:1.25;color:#78736d;white-space:normal}
'''
          css_path.write_text(css)

          test_path=Path('tests/v11.57-regression.test.js')
          tests=test_path.read_text()
          if "const serverSource=" not in tests:
              tests=tests.replace(
                "const appSource=fs.readFileSync(path.join(__dirname,'..','public','app.js'),'utf8');",
                "const appSource=fs.readFileSync(path.join(__dirname,'..','public','app.js'),'utf8');\nconst serverSource=fs.readFileSync(path.join(__dirname,'..','server.js'),'utf8');"
              )
          marker="test('Hotbath preserves official double-slash asset paths'"
          if marker not in tests:
              tests+='''\n\ntest('Hotbath preserves official double-slash asset paths',()=>{
  const start=serverSource.indexOf('function normalizeHotbathAssetUrl(');
  assert.ok(start>=0,'Hotbath asset normalizer must exist');
  const end=serverSource.indexOf('\\nfunction ',start+20);
  const source=serverSource.slice(start,end>start?end:start+1200);
  assert.doesNotMatch(source,/pathname\\s*=.*replace\\(\\/\\\\\\/{2,}/,'Hotbath manufacturer paths must not collapse double slashes');
  assert.match(source,/return u\\.href/,'Hotbath normalizer must preserve URL.href from the official page');
});

test('quote is structured by room then bathroom space without changing article inclusion',()=>{
  assert.match(appSource,/const QUOTE_SPACE_ORDER=\\{LAVABO:0,DOUCHE:1,BAIN:2,WC:3,AUTRES:4\\}/);
  assert.match(appSource,/quote-room-row/,'printed quote must render room headings');
  assert.match(appSource,/quote-space-row/,'printed quote must render functional space headings');
  assert.match(appSource,/qe-room-group/,'quote editor must render room headings');
  assert.match(appSource,/qe-space-group/,'quote editor must render functional space headings');
  const quoteStart=appSource.indexOf('function quoteRows(');
  const quoteEnd=appSource.indexOf('function quotePages(',quoteStart);
  const quoteSource=appSource.slice(quoteStart,quoteEnd);
  assert.match(quoteSource,/roomRows\\.sort/,'article rows must be ordered inside each room by functional space');
  assert.doesNotMatch(quoteSource,/hideFromDossier/,'dossier visibility must never remove an article from the quote');
});
'''
          test_path.write_text(tests)
          PY
      - run: npm run check
      - run: npm test
      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name "hydropolis-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/source-edit-v1157.yml
          git add server.js public/app.js public/styles.css tests/v11.57-regression.test.js
