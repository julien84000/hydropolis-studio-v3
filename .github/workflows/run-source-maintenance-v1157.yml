name: run-source-maintenance-v1157

on:
  push:
    branches:
      - "fix/v11.57-sira-pdf-audit"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v11.57-sira-pdf-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python .github/source-maintenance-v1157.py
      - run: npm ci
      - run: npm run build
      - name: Commit validated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/app.js public/styles.css
          git rm .github/source-maintenance-v1157.py .github/workflows/run-source-maintenance-v1157.yml
          git commit -m "fix: preserve Hotbath assets and structure quote"
          git push origin HEAD:fix/v11.57-sira-pdf-audit
