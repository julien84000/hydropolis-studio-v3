name: Release validation

on:
  push:
    branches:
      - "fix/v11.57-sira-pdf-audit"
      - main
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Save Hidrobox PDF parity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidrobox-2026-pdf-parity
          path: build-audit/hidrobox-2026-pdf-parity.json
          if-no-files-found: ignore
          retention-days: 30
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
