name: gessi-mismatch-audit

on:
  push:
    branches:
      - "fix/v11.57-sira-pdf-audit"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v11.57-sira-pdf-audit
          fetch-depth: 0
      - run: python .github/gessi-mismatch-audit.py
      - name: Commit report and clean temporary audit files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/gessi-mismatch-audit.json
          git rm .github/gessi-mismatch-audit.py .github/workflows/gessi-mismatch-audit.yml
          git commit -m "audit: map Gessi classification mismatches"
          git push origin HEAD:fix/v11.57-sira-pdf-audit
